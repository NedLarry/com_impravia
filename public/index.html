<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impravia | Coming Soon</title>

<!-- SEO -->
<meta name="description" content="Impravia LTD. is building next-generation financial software solutions. Coming soon.">
<meta name="keywords" content="fintech, software, finance, startup">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body, html {
    height: 100%;
    color: #fff;
    overflow-x: hidden;
}

/* Video */
.video-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.2;
    z-index: -2;
}

/* Overlay */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0.9));
    z-index: -1;
}

/* Navbar */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
}

nav ul {
    display: flex;
    list-style: none;
    gap: 25px;
}

nav ul li {
    cursor: pointer;
    transition: 0.3s;
}

nav ul li:hover {
    opacity: 0.6;
}

/* Mobile */
.menu-toggle {
    display: none;
    cursor: pointer;
}

@media(max-width: 768px) {
    nav ul {
        position: absolute;
        top: 70px;
        right: 0;
        background: rgba(0,0,0,0.9);
        flex-direction: column;
        width: 200px;
        padding: 20px;
        display: none;
    }

    nav ul.active {
        display: flex;
    }

    .menu-toggle {
        display: block;
    }
}

/* Content */
.container {
    height: 85vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    animation: fadeIn 2s ease-in-out;
}

.container h2 {
    font-size: 48px;
    margin-bottom: 15px;
    animation: slideUp 1.5s ease;
}

.container p {
    font-size: 18px;
    margin-bottom: 25px;
    opacity: 0.85;
}

/* Form */
form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

input {
    padding: 12px;
    border-radius: 5px;
    border: none;
    outline: none;
    width: 250px;
}

button {
    padding: 12px 20px;
    border: none;
    background: #00c2ff;
    color: white;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    opacity: 0.9;
}

/* Animations */
@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}

@keyframes slideUp {
    from {
        transform: translateY(40px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

/* Footer */
footer {
    text-align: center;
    padding: 15px;
    font-size: 14px;
    opacity: 0.6;
}
</style>
</head>

<body>

<video autoplay muted loop class="video-bg">
    <source src="https://www.w3schools.com/howto/rain.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<nav>
    <img src="./assests/imgs/Impravia_logo.png" width="110px" height="50px">

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <ul id="navMenu">
        <li>Home</li>
        <li>Products</li>
        <li>Contact Us</li>
    </ul>
</nav>

<div class="container">
    <h2>Coming Soon</h2>
    <p>We're building innovative solutions.</p>

    <form id="formSubmit">
        <input type="email" id="email" placeholder="Enter your email" required>
        <button type="submit">Notify Me</button>
    </form>
</div>

<footer>
    © 2026 Impravia ltd. All rights reserved.
</footer>

<script src="./js/index.js"></script>

</body>
</html>
